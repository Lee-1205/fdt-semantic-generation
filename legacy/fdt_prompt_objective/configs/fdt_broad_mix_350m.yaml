data:
  dataset_dir: prepared_data/broad_english_code_300m
  tokenizer_name: tokenizers/fdt_bpe
  interleave_sources: true

model:
  model_type: fdt_optimized
  dim: 384
  n_layers: 6
  n_heads: 6
  mlp_ratio: 4
  max_seq_len: 512
  dropout: 0.1
  num_anchors: 128
  top_k: 8
  use_self_attention: false
  use_rope: false
  tie_embeddings: false
  use_local_mixer: true
  local_mixer_kernel_size: 5

fdt:
  routing_type: cosine
  routing_backend: matmul
  aggregation_impl: dense_gather_first
  enable_anchor_metrics: true
  compute_anchor_metrics_every: 4
  enable_diagnostics: false
  use_cached_normalized_anchors: true
  use_incremental_anchor_state: true
  detach_diagnostics: true

train:
  output_dir: runs/fdt_broad_mix_350m
  target_tokens: 350000000
  max_steps: 8100
  # Same 32-sequence effective batch with fewer accumulation launches.
  batch_size: 8
  grad_accum_steps: 4
  learning_rate: 0.00004
  base_lr_scale: 1.0
  local_mixer_lr_scale: 1.0
  weight_decay: 0.1
  precision: bf16
  grad_clip: 1.0
  log_every: 1
  save_every: 500
  step_checkpoint_retention: 2
  eval_every: 250
  eval_batches: 64
  diversity_every: 8
  cluster_weight: 0.01
  diversity_weight: 0.1
  usage_weight: 0.005
  entropy_weight: 0.003
  entropy_over_weight: 0.2
  entropy_target_ratio_start: 0.52
  entropy_target_ratio_end: 0.44
  override_resume_lr: true
  reset_data_cursor_on_dataset_change: true
  lr_schedule: cosine
  lr_schedule_start_step: 32000
  lr_warmup_steps: 100
  lr_warmup_start: 0.000015
  lr_decay_steps: 8100
  lr_min_ratio: 0.25
  auto_onk: true
  onk_min_absolute_improvement: 0.02
  onk_min_relative_improvement: 0.002
  onk_min_entropy_normalized: 0.25
  onk_max_entropy_normalized: 0.85
  onk_max_dead_anchor_ratio: 0.10
