data:
  dataset_dir: prepared_data/v3_language_50m_24k
  tokenizer_name: tokenizers/fdt_v3_bpe_24k
  interleave_sources: true

model:
  model_type: fdt_v3
  dim: 512
  n_layers: 9
  n_heads: 8
  mlp_ratio: 4
  max_seq_len: 512
  dropout: 0.0
  use_rope: false
  tie_embeddings: true
  use_self_attention: false
  anchor_layer_pattern: alternate
  anchor_layer_indices: [0, 2, 4, 6, 8]
  num_anchors: 256
  top_k: 8
  local_attention_window: 64
  router_dim: 128
  anchor_scan_chunk_size: 64
  anchor_recency_bias: 4.0

fdt:
  routing_type: cosine
  cosine_temperature: 0.25
  routing_backend: matmul
  aggregation_impl: sparse_chunked_scan
  enable_anchor_metrics: true
  compute_anchor_metrics_every: 4
  enable_diagnostics: false
  use_cached_normalized_anchors: true
  use_incremental_anchor_state: true
  detach_diagnostics: true

train:
  output_dir: runs/fdt_v3_language_pilot_5m
  target_tokens: 5000000
  max_steps: 0
  batch_size: 8
  grad_accum_steps: 1
  learning_rate: 0.0003
  lr_schedule: cosine
  lr_warmup_steps: 100
  lr_warmup_start: 0.00003
  lr_min_ratio: 0.1
  weight_decay: 0.1
  precision: bf16
  grad_clip: 1.0
  log_every: 10
  save_every: 250
  eval_every: 250
  eval_batches: 8
  step_checkpoint_retention: 2
  diversity_every: 8
  cluster_weight: 0.005
  diversity_weight: 0.1
  usage_weight: 0.01
  entropy_weight: 0.003
  entropy_over_weight: 0.2
  entropy_target_ratio_start: 0.60
  entropy_target_ratio_end: 0.45
  auto_onk: true
  onk_min_entropy_normalized: 0.25
  onk_max_entropy_normalized: 0.85
  onk_max_dead_anchor_ratio: 0.10
