seed: 20260803

target_mix:
  code_python: 1.0

sources:
  code:
    kind: hf_code
    preferred:
      dataset: angie-chen55/python-github-code
      split: train
      streaming: true
      content_field: code

dedup:
  exact: true
  cross_source: true
  sqlite_path: artifacts/dedup_v3_python_additional_75m.sqlite3
  priority:
    - code_python

splits:
  train: 0.99
  validation: 0.005
  test: 0.005

packing:
  enabled: true
  max_seq_len: 2048
  add_eos_between_documents: true
  shard_tokens: 25000000

quota:
  relative_tolerance: 0.001
  allow_document_overshoot: true

filters:
  web:
    min_chars: 160
    min_tokens: 24
    max_tokens: 200000
    max_repetition_ratio: 0.30
    min_alpha_ratio: 0.50
  code:
    min_chars: 20
    min_tokens: 8
    max_tokens: 200000
    reject_minified: true
    reject_generated: true
    reject_vendor: true
    reject_secrets: true

limits:
  max_download_gb: 8
  max_output_gb: 3
  max_documents: 0
  min_free_gb: 15

cache:
  hf_home: ""
  reuse_existing: true
