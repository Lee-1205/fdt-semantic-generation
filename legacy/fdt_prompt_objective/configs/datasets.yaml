seed: 42

target_mix:
  fineweb_edu: 0.60
  fineweb: 0.15
  code: 0.25

code_mix:
  python: 0.45
  javascript_typescript: 0.20
  c_cpp: 0.10
  java: 0.10
  rust_go: 0.10
  structured_docs: 0.05
  allow_automatic_redistribution: false

sources:
  fineweb_edu:
    kind: hf_text
    dataset: HuggingFaceFW/fineweb-edu
    preferred_config: sample-10BT
    split: train
    streaming: true
    content_field: text
    license: ODC-By-1.0

  fineweb:
    kind: hf_text
    dataset: HuggingFaceFW/fineweb
    preferred_config: sample-10BT
    split: train
    streaming: true
    content_field: text
    license: ODC-By-1.0

  code:
    kind: hf_code
    preferred:
      dataset: bigcode/starcoderdata
      split: train
      streaming: true
      content_field: content
    fallbacks:
      - dataset: bigcode/the-stack-smol
        split: train
        streaming: true
        content_field: content
      - dataset: bigcode/the-stack-smol-xl
        split: train
        streaming: true
        content_field: content
        access_method: language_json_files
      - dataset: bigcode/the-stack-v2
        split: train
        streaming: true
        content_field: content
        note: The Stack v2 may expose metadata/SWH IDs and need separate content retrieval.
      - dataset: codeparrot/github-code
        split: train
        streaming: true
        content_field: content
        access_method: generic_parquet_loader
      - dataset: codeparrot/github-code-clean
        split: train
        streaming: true
        content_field: content
        access_method: generic_parquet_loader

dedup:
  exact: true
  cross_source: true
  sqlite_path: artifacts/dedup.sqlite3
  priority:
    - fineweb_edu
    - fineweb
    - code

splits:
  train: 0.99
  validation: 0.005
  test: 0.005

packing:
  enabled: true
  max_seq_len: 512
  add_eos_between_documents: true
  shard_tokens: 25000000

quota:
  relative_tolerance: 0.001
  allow_document_overshoot: true

filters:
  web:
    min_chars: 200
    min_tokens: 32
    max_tokens: 200000
    max_repetition_ratio: 0.35
    min_alpha_ratio: 0.45
  code:
    min_chars: 20
    min_tokens: 8
    max_tokens: 200000
    reject_minified: true
    reject_generated: true
    reject_vendor: true
    reject_secrets: true

limits:
  max_download_gb: 5
  max_output_gb: 20
  max_documents: 0
  min_free_gb: 20

cache:
  hf_home: ""
  reuse_existing: true

logging:
  interval_documents: 1000
  interval_seconds: 60
