seed: 20260727

target_mix:
  tinystories: 0.25
  cosmopedia: 0.35
  fineweb_edu_dedup: 0.40

sources:
  tinystories:
    kind: hf_text
    dataset: roneneldan/TinyStories
    preferred_config: default
    split: train
    streaming: true
    content_field: text

  cosmopedia:
    kind: hf_text
    dataset: HuggingFaceTB/smollm-corpus
    preferred_config: cosmopedia-v2
    split: train
    streaming: true
    content_field: text

  fineweb_edu_dedup:
    kind: hf_text
    dataset: HuggingFaceTB/smollm-corpus
    preferred_config: fineweb-edu-dedup
    split: train
    streaming: true
    content_field: text

dedup:
  exact: true
  cross_source: true
  sqlite_path: artifacts/dedup.sqlite3
  priority:
    - fineweb_edu_dedup
    - cosmopedia
    - tinystories

splits:
  train: 0.99
  validation: 0.005
  test: 0.005

packing:
  enabled: true
  max_seq_len: 512
  add_eos_between_documents: true
  shard_tokens: 25000000

quota:
  relative_tolerance: 0.001
  allow_document_overshoot: true

filters:
  web:
    min_chars: 120
    min_tokens: 24
    max_tokens: 200000
    max_repetition_ratio: 0.30
    min_alpha_ratio: 0.55
  code:
    min_chars: 20
    min_tokens: 8
    max_tokens: 200000
    reject_minified: true
    reject_generated: true
    reject_vendor: true
    reject_secrets: true

limits:
  max_download_gb: 12
  max_output_gb: 20
  max_documents: 0
  min_free_gb: 15

cache:
  hf_home: ""
  reuse_existing: true

logging:
  interval_documents: 1000
  interval_seconds: 60
