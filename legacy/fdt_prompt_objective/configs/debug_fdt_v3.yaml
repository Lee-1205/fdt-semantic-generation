data:
  dataset_dir: prepared_data/quality_english_100m_v2
  tokenizer_name: tokenizers/fdt_bpe
  interleave_sources: true

model:
  model_type: fdt_v3
  dim: 512
  n_layers: 9
  n_heads: 8
  mlp_ratio: 4
  max_seq_len: 512
  dropout: 0.0
  use_rope: false
  tie_embeddings: true
  use_self_attention: false
  anchor_layer_pattern: alternate
  anchor_layer_indices: [0, 2, 4, 6, 8]
  num_anchors: 256
  top_k: 8
  local_attention_window: 64
  router_dim: 128
  anchor_scan_chunk_size: 64
  anchor_recency_bias: 4.0

fdt:
  routing_type: cosine
  routing_backend: matmul
  aggregation_impl: sparse_chunked_scan
  enable_anchor_metrics: true
  compute_anchor_metrics_every: 4
  enable_diagnostics: false
  use_cached_normalized_anchors: true
  use_incremental_anchor_state: true
  detach_diagnostics: true

train:
  output_dir: runs/debug_fdt_v3
  target_tokens: 1000000
  max_steps: 1
  batch_size: 1
  grad_accum_steps: 1
  learning_rate: 0.0003
  weight_decay: 0.1
  precision: bf16
  grad_clip: 1.0
  log_every: 1
  save_every: 1
  eval_every: 0
  diversity_every: 8
  cluster_weight: 0.01
  diversity_weight: 0.1
  usage_weight: 0.005
  entropy_weight: 0.003
  entropy_over_weight: 0.2
  entropy_target_ratio_start: 0.55
  entropy_target_ratio_end: 0.45
