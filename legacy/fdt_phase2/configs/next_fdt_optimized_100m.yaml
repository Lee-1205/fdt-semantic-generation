data:
  dataset_dir: prepared_data/fdt_rlm_100m
  tokenizer_name: tokenizers/fdt_bpe
  interleave_sources: true
model:
  model_type: fdt_optimized
  dim: 384
  n_layers: 6
  n_heads: 6
  mlp_ratio: 4
  max_seq_len: 512
  dropout: 0.1
  num_anchors: 128
  top_k: 8
fdt:
  routing_type: cosine
  routing_backend: matmul
  aggregation_impl: dense_gather_first
  enable_anchor_metrics: false
  anchor_metrics_interval: 1000
  compute_anchor_metrics_every: 0
  enable_diagnostics: false
  use_cached_normalized_anchors: true
  use_incremental_anchor_state: true
  detach_diagnostics: true
train:
  output_dir: runs/next_fdt_optimized_100m
  target_tokens: 100000000
  max_steps: 0
  batch_size: 8
  grad_accum_steps: 1
  learning_rate: 0.00003
  weight_decay: 0.1
  precision: bf16
  save_every: 2500
  eval_every: 0
