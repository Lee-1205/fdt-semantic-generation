data: {dataset_dir: prepared_data/fdt_rlm_100m, tokenizer_name: tokenizers/fdt_bpe, interleave_sources: true}
model:
  model_type: fdt_anchor_mixer
  dim: 192
  n_layers: 4
  n_heads: 4
  mlp_ratio: 2
  max_seq_len: 256
  dropout: 0.1
  num_anchors: 64
  top_k: 4
fdt:
  routing_backend: matmul
  aggregation_impl: dense_gather_first
  enable_anchor_metrics: false
  compute_anchor_metrics_every: 0
  enable_diagnostics: false
  use_cached_normalized_anchors: true
  detach_diagnostics: true
  use_incremental_anchor_state: true
train:
  output_dir: runs/next_anchor_mixer_micro
  target_tokens: 25000000
  max_steps: 0
  batch_size: 4
  grad_accum_steps: 1
  learning_rate: 0.00003
  precision: bf16
  save_every: 2500
  eval_every: 0
