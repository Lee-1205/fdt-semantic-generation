data:
  dataset_dir: prepared_data/fdt_rlm_100m
  tokenizer_name: tokenizers/fdt_bpe
  interleave_sources: true
model:
  model_type: fdt_optimized
  dim: 384
  n_layers: 6
  n_heads: 6
  mlp_ratio: 4
  max_seq_len: 512
  dropout: 0.1
  num_anchors: 128
  top_k: 8
  use_self_attention: false
fdt:
  routing_type: cosine
  routing_backend: matmul
  aggregation_impl: dense_gather_first
  enable_anchor_metrics: true
  compute_anchor_metrics_every: 1
  enable_diagnostics: false
  use_cached_normalized_anchors: true
  use_incremental_anchor_state: true
  detach_diagnostics: true
train:
  output_dir: runs/live_fdt_optimized_101m
  target_tokens: 101000000
  max_steps: 245
  batch_size: 2
  grad_accum_steps: 4
  learning_rate: 0.00003
  weight_decay: 0.1
  precision: bf16
  grad_clip: 1.0
  log_every: 1
  save_every: 25
  eval_every: 25
  eval_batches: 8
  diversity_every: 4
  auto_onk: true
  onk_min_absolute_improvement: 0.02
  onk_min_relative_improvement: 0.0025
  onk_min_entropy_normalized: 0.25
  onk_max_entropy_normalized: 0.85
  onk_max_dead_anchor_ratio: 0.10
