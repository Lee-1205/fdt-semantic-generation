[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fdt-local"
version = "0.1.0"
description = "Bounded local CUDA adapter experiments with durable recovery"
requires-python = ">=3.10"
dependencies = ["torch==2.10.0", "numpy==2.2.6", "PyYAML==6.0.3", "filelock>=3.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
